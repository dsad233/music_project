version: '4'
services:
  local-db:
    image: mysql:9.0.1
    container_name: Mysql_local
    restart: always
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./db/mysql/data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d
    platform: linux/x86_64
  music_project_code:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
    - .env
    container_name: music_project_code
    expose:
     - "3000"
    restart: "always"
    command: npm run start